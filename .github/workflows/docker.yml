name: Build Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Commits touching only the J2ME app or docs don't need a new image
    # (the NAS would pull and restart for nothing). Tags ignore paths.
    paths-ignore:
      - 'client/**'
      - '.github/workflows/j2me.yml'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes the running build pointless.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The server runs on an ARM NAS: build arm64 only, natively on GitHub's
  # ARM runner (QEMU emulation took 10+ minutes).
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build info
        id: info
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Build and actually run the image before publishing it.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          load: true
          tags: fbclient:test
          build-args: BUILD_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as in production (no proxy) on a local page, so the test doesn't
      # depend on Facebook: check that the browser renders a frame, the
      # overscan buffer is applied and the live stream answers.
      - name: Smoke test container
        run: |
          docker run -d --name test -p 8080:8080 --shm-size=512m \
            -e 'HOME_URL=data:text/html,<h1>fbclient</h1>' fbclient:test
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/ping >/dev/null 2>&1 && { echo "ready after ${i}s"; break; }
            sleep 1
          done
          docker logs test
          docker logs test 2>&1 | grep -q 'proxy none (direct)'
          curl -fsS -D headers.txt -o frame.jpg 'http://127.0.0.1:8080/a?id=ci&w=240&h=320&ov=100'
          cat headers.txt
          grep -qi '^content-type: image/jpeg' headers.txt
          grep -qi '^x-oy:' headers.txt
          python3 -c "import struct;d=open('frame.jpg','rb').read();i=d.find(b'\xff\xc0');w,h=struct.unpack('>HH',d[i+7:i+9]+d[i+5:i+7]);print('frame',w,'x',h);assert (w,h)==(240,960)"
          curl -s --max-time 8 -o live.bin 'http://127.0.0.1:8080/live?id=ci&w=240&h=320&ov=100' || true
          echo "live: $(wc -c < live.bin) bytes, header: $(head -c 24 live.bin | head -n 1)"
          docker logs --tail 20 test
          head -c 2 live.bin | grep -q '^F '
          echo "live stream OK"
          docker exec test yt-dlp --version

      - name: Clean up
        if: always()
        run: docker rm -f test || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Same build as tested above, straight from the cache.
      - name: Push to GHCR (arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha
