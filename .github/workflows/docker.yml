name: Build Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Commits touching only the J2ME app or docs don't need a new image
    # (the NAS would pull and restart for nothing). Tags ignore paths.
    paths-ignore:
      - 'client/**'
      - '.github/workflows/j2me.yml'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes the running build pointless.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Each architecture builds on its own native runner: arm64 under QEMU
  # emulation took tens of minutes (npm, apt, Chromium install all emulated).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build info
        id: info
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Build and actually run the image of this architecture first.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: ${{ matrix.platform }}
          load: true
          tags: fbclient:test
          build-args: BUILD_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # CI can't reach Facebook through the private proxy: point PROXY at a
      # closed port and use a local page, then check that the browser renders
      # a frame, the overscan buffer is applied and the live stream answers.
      - name: Smoke test container (${{ matrix.arch }})
        run: |
          docker run -d --name test -p 8080:8080 --shm-size=512m \
            -e PROXY=socks5://127.0.0.1:9 -e 'HOME_URL=data:text/html,<h1>fbclient</h1>' fbclient:test
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/ping >/dev/null 2>&1 && { echo "ready after ${i}s"; break; }
            sleep 1
          done
          docker logs test
          curl -fsS -D headers.txt -o frame.jpg 'http://127.0.0.1:8080/a?id=ci&w=240&h=320&ov=100'
          cat headers.txt
          grep -qi '^content-type: image/jpeg' headers.txt
          grep -qi '^x-oy:' headers.txt
          python3 -c "import struct;d=open('frame.jpg','rb').read();i=d.find(b'\xff\xc0');w,h=struct.unpack('>HH',d[i+7:i+9]+d[i+5:i+7]);print('frame',w,'x',h);assert (w,h)==(240,960)"
          curl -s --max-time 8 -o live.bin 'http://127.0.0.1:8080/live?id=ci&w=240&h=320&ov=100' || true
          echo "live: $(wc -c < live.bin) bytes, header: $(head -c 24 live.bin | head -n 1)"
          docker logs --tail 20 test
          head -c 2 live.bin | grep -q '^F '
          echo "live stream OK"
          docker exec test yt-dlp --version

      - name: Clean up
        if: always()
        run: docker rm -f test || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push this architecture by digest only (from the cache filled above);
      # the merge job puts both under the real tags.
      - name: Push ${{ matrix.arch }} by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Create multi-arch tags (amd64 + arm64)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
