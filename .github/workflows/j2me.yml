name: Build J2ME app

# Only when the app changes (server changes build the image, docker.yml).
# A push to main replaces FbClient.jar/.jad in the latest release: no new
# release per change, and phones (android/files.py, the release page) always
# get the newest app from the same place.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/j2me.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/j2me.yml'
  workflow_dispatch:

# A newer push makes the running build pointless.
concurrency:
  group: j2me-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ECJ 3.26 and ProGuard 7 run on JDK 11+; Maven only downloads tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: client/tools/pom.xml

      # MIDlet-Version (a.b.c): the latest release's a.b (v2.0.1 -> 2.0) and
      # the run number, so each build is newer than the one phones have.
      - name: Version
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          base=${tag#v}
          base=${base%.*}
          [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]] || base=1.0
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # No server in the jar: the app asks for it on its first start.
      - name: Build jar + jad
        run: VERSION=${{ steps.info.outputs.version }} bash client/build.sh

      # Real S60 phones only run CLDC classes: version 45 with StackMap
      # (preverified). Anything newer fails to install without a reason.
      - name: Check classes are CLDC-compliant
        run: |
          mkdir -p /tmp/check && cd /tmp/check && unzip -oq "$GITHUB_WORKSPACE/client/build/FbClient.jar"
          for f in $(find . -name '*.class'); do
            javap -v "$f" | grep -q 'major version: 45' || { echo "wrong class version: $f"; exit 1; }
          done
          if find . -name '*$*.class' | grep -q .; then echo "nested classes found (KEmulator fails on them)"; exit 1; fi
          javap -v fbc/Net.class | grep -q StackMap || { echo "not preverified"; exit 1; }
          echo "All classes are version 45 with StackMap"

      - uses: actions/upload-artifact@v4
        with:
          name: FbClient-${{ steps.info.outputs.version }}-${{ steps.info.outputs.sha }}
          path: |
            client/build/FbClient.jar
            client/build/FbClient.jad

      # The latest release gets the new files (same names, replaced). Only a
      # repo without any release gets one made.
      - name: Replace the app in the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" client/build/FbClient.jar client/build/FbClient.jad --clobber
            echo "Replaced the app in release $TAG (MIDlet-Version $VERSION)"
          else
            gh release create "v$VERSION" client/build/FbClient.jar client/build/FbClient.jad \
              --title "v$VERSION" --notes "FbClient app (J2ME)."
          fi
