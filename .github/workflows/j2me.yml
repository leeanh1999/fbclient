name: Build J2ME app

# Only when the app changes (server changes build the image, docker.yml).
# A push to main that changes the app and the server makes a new release;
# one that changes only the app replaces FbClient.jar/.jad in the latest
# release. Phones (android/files.py, the release page) always get the newest
# app from the latest release.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/j2me.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/j2me.yml'
  workflow_dispatch:

# A newer push makes the running build pointless.
concurrency:
  group: j2me-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to see what the push changed

      # Did this push change the server too? (Then it makes a new release.)
      - name: What changed
        id: changed
        run: |
          before='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$before" "${{ github.sha }}")
          else
            files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          echo "$files"
          if [ "${{ github.event_name }}" = push ] && echo "$files" | grep -q '^server/'; then
            echo "release=new" >> "$GITHUB_OUTPUT"
          else
            echo "release=replace" >> "$GITHUB_OUTPUT"
          fi

      # ECJ 3.26 and ProGuard 7 run on JDK 11+; Maven only downloads tools.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: client/tools/pom.xml

      # MIDlet-Version a.b.<run number>, so each build is newer than the one
      # phones have: a.b of the latest release (v2.0.1 -> 2.0) when its files
      # are replaced; a new release raises b (2.1) and is tagged v2.1.<run>.
      - name: Version
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.changed.outputs.release }}
        run: |
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          base=${tag#v}
          base=${base%.*}
          [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]] || base=1.0
          if [ "$RELEASE" = new ] || [ -z "$tag" ]; then
            base="${base%.*}.$(( ${base#*.} + 1 ))"
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # No server in the jar: the app asks for it on its first start.
      - name: Build jar + jad
        run: VERSION=${{ steps.info.outputs.version }} bash client/build.sh

      # Real S60 phones only run CLDC classes: version 45 with StackMap
      # (preverified). Anything newer fails to install without a reason.
      # FbClient-bb.jar (BlackBerry) must not mention Nokia's API: BlackBerry
      # refuses to install it. FbClient.jar likewise not BlackBerry's.
      - name: Check classes are CLDC-compliant
        run: |
          for jar in FbClient FbClient-bb; do
            rm -rf /tmp/check && mkdir -p /tmp/check && cd /tmp/check
            unzip -oq "$GITHUB_WORKSPACE/client/build/$jar.jar"
            for f in $(find . -name '*.class'); do
              javap -v "$f" | grep -q 'major version: 45' || { echo "$jar: wrong class version: $f"; exit 1; }
            done
            if find . -name '*$*.class' | grep -q .; then echo "$jar: nested classes found (KEmulator fails on them)"; exit 1; fi
            javap -v fbc/Net.class | grep -q StackMap || { echo "$jar: not preverified"; exit 1; }
            other=net/rim
            [ "$jar" = FbClient-bb ] && other=com/nokia
            if grep -rlq "$other" .; then echo "$jar mentions $other"; exit 1; fi
            echo "$jar: all classes are version 45 with StackMap, no $other"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FbClient-${{ steps.info.outputs.version }}-${{ steps.info.outputs.sha }}
          path: |
            client/build/FbClient.jar
            client/build/FbClient.jad
            client/build/FbClient-bb.jar
            client/build/FbClient-bb.jad

      # App only: the latest release gets the new files (same names,
      # replaced). App and server (or no release yet): a new release.
      - name: Publish the app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" client/build/FbClient.jar client/build/FbClient.jad \
              client/build/FbClient-bb.jar client/build/FbClient-bb.jad --clobber
            echo "Replaced the app in release $TAG (MIDlet-Version $VERSION)"
          else
            gh release create "v$VERSION" client/build/FbClient.jar client/build/FbClient.jad \
              client/build/FbClient-bb.jar client/build/FbClient-bb.jad \
              --target "${{ github.sha }}" --title "v$VERSION" --generate-notes
            echo "New release v$VERSION (app and server changed)"
          fi
